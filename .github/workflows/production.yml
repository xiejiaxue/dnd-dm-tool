name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# GitHub checks code only; Cloudflare releases are explicit local operations.
concurrency:
  group: dnd-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run music:prepare
      - run: npm test
      - run: npm run build
      - run: npm run release:stamp
      - name: Check source remained clean
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: checked-assets
          path: client/dist
          include-hidden-files: true
          retention-days: 14
